[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-reel-publisher"
version = "0.1.0"
description = "Review-first Instagram Reels publishing workflow"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.13,<2"]

[project.scripts]
reel-publisher = "reel_publisher.cli:main"

[tool.setuptools.packages.find]
include = ["reel_publisher*"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["reel_publisher"]
